# main への push で macOS / Windows / Linux の各ランナーで typecheck・lint・test を実行する。
# パッケージ作成はしない（タグ push 時の release.yml が担当）。
name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じブランチで新しい push が来たら、古い実行は取り消す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # pnpm 本体と Node.js を入れ、pnpm install --frozen-lockfile まで行う
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@22
          cache: true
          require-lockfile: true

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
