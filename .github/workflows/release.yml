# v* タグの push で macOS / Windows / Linux 向けのパッケージを作り、GitHub Release に添付する。
# 署名は当面行わない（docs/design/decisions.md F-3）。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # pnpm 本体と Node.js を入れ、pnpm install --frozen-lockfile まで行う
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm build

      - name: Package
        run: pnpm exec electron-builder ${{ matrix.platform }} --publish never
        env:
          # 証明書が無いので、macOS のキーチェーンから署名用 ID を探しに行かせない
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
